<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Hiriya</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* Custom CSS to make the container and canvas fill the viewport */
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden; /* Prevent scrolling if content overflows */
        width: 100%;
        height: 100%;
      }
      #unity-container {
        /* Position fixed ensures it's relative to the viewport, not just the document flow */
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex; /* Use flexbox for centering content */
        justify-content: center; /* Center horizontally */
        align-items: center; /* Center vertically */
        background: #000; /* A black background for the splash screen */
      }
      #unity-canvas {
        /* Canvas fills the fixed container */
        width: 100%;
        height: 100%;
        display: block; /* Remove extra space below canvas */
      }
      /* Ensure other UI elements within the container are positioned correctly */
      #unity-loading-bar,
      #unity-warning,
      #unity-footer {
        position: absolute;
        /* Adjust positioning as needed, relative to #unity-container */
      }
      #unity-footer {
          bottom: 10px;
          left: 50%;
          transform: translateX(-50%);
          /* Ensure footer is above the canvas but within its bounds */
          z-index: 10; /* Give it a higher z-index to be on top */
      }
      #unity-loading-bar {
          z-index: 10;
      }
      #unity-warning {
          z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <!-- Removed width/height attributes from canvas to let CSS/JS control it fully -->
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Hiriya</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var unityContainer = document.querySelector("#unity-container");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/___Publish.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/___Publish.data.br",
        frameworkUrl: buildUrl + "/___Publish.framework.js.br",
        codeUrl: buildUrl + "/___Publish.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Playscape",
        productName: "Hiriya",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // Crucial for letting Unity adjust its render target to the canvas DOM size
        matchWebGLToCanvasSize: true
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        unityContainer.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        unityContainer.className = "unity-desktop";
        canvas.className = "unity-desktop";
        // Fixed dimensions for desktop are removed, CSS and Unity's matchWebGLToCanvasSize handle sizing.
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      // Function to ensure canvas fills the available space
      function resizeCanvas() {
        // With #unity-container using position: fixed and top/left/right/bottom 0,
        // it will cover the entire visible viewport.
        // The canvas inside it, set to width: 100%; height: 100%; in CSS, will
        // automatically fill this container.
        // Unity's matchWebGLToCanvasSize: true will ensure its internal render
        // buffer matches the canvas DOM element's size.
        // No explicit JS sizing is strictly needed here for the main canvas,
        // but this function ensures a callback is present for the resize event.
      }

      // Initial resize on load and creating Unity instance
      window.onload = () => {
        // Call resizeCanvas initially, though CSS should handle most of it.
        // This ensures the window.innerHeight/innerWidth are properly calculated
        // after all UI is loaded.
        resizeCanvas();

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
          }).then((unityInstance) => {
            document.querySelector("#unity-loading-bar").style.display = "none";
            document.querySelector("#unity-fullscreen-button").onclick = () => {
              unityInstance.SetFullscreen(1);
            };
            // Add event listener for window resize
            window.addEventListener('resize', resizeCanvas);

          }).catch((message) => {
            alert(message); // Consider replacing with a custom modal/message box
          });
        };
        document.body.appendChild(script);
      };
    </script>
  </body>
</html>
