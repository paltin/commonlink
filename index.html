<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Hiriya</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* Custom CSS to make the container and canvas fill the viewport */
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden; /* Prevent scrolling if content overflows */
        width: 100%;
        height: 100%;
      }
      #unity-container {
        position: absolute; /* Use absolute positioning to fill viewport */
        width: 100%;
        height: 100%;
        display: flex; /* Use flexbox for centering content */
        justify-content: center; /* Center horizontally */
        align-items: center; /* Center vertically */
        background: #000; /* A black background for the splash screen */
      }
      #unity-canvas {
        width: 100%; /* Make canvas fill its container */
        height: 100%; /* Make canvas fill its container */
        display: block; /* Remove extra space below canvas */
      }
      /* Ensure other UI elements within the container are positioned correctly */
      #unity-loading-bar,
      #unity-warning,
      #unity-footer {
        position: absolute;
        /* You might need to adjust their positioning (top, bottom, left, right)
           to ensure they are visible and correctly placed within the full-screen canvas. */
      }
      /* Example adjustment for footer if it's pushed off screen */
      #unity-footer {
          bottom: 10px; /* Adjust as needed */
          left: 50%;
          transform: translateX(-50%);
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=800 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Hiriya</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var unityContainer = document.querySelector("#unity-container");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/___Publish.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/___Publish.data.br",
        frameworkUrl: buildUrl + "/___Publish.framework.js.br",
        codeUrl: buildUrl + "/___Publish.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Playscape",
        productName: "Hiriya",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // Crucial for letting Unity adjust its render target to the canvas DOM size
        matchWebGLToCanvasSize: true
      };

      // Unity's default mobile setup already handles full screen well.
      // For desktop, we explicitly set the container and canvas to fill the viewport.
      // The `else` block for desktop is now largely handled by CSS,
      // but we still ensure the class names are correct.
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        unityContainer.className = "unity-mobile"; // Ensure unity-mobile class is applied
        canvas.className = "unity-mobile"; // Ensure unity-mobile class is applied
      } else {
        unityContainer.className = "unity-desktop"; // Ensure unity-desktop class is applied
        canvas.className = "unity-desktop"; // Ensure unity-desktop class is applied
        // The fixed width/height on canvas.style for desktop is removed as CSS handles it
        // and Unity's matchWebGLToCanvasSize will sync internal resolution.
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      // Function to resize canvas and container
      function resizeCanvas() {
        // unityContainer will be 100% width/height of body, which is 100% of viewport
        // The canvas inside it will also be 100% of its parent.
        // Unity's internal render buffer will match this if matchWebGLToCanvasSize is true.
      }

      // Initial resize on load
      window.onload = () => {
        resizeCanvas(); // Call once on load
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
          }).then((unityInstance) => {
            document.querySelector("#unity-loading-bar").style.display = "none";
            document.querySelector("#unity-fullscreen-button").onclick = () => {
              unityInstance.SetFullscreen(1);
            };
            // Add event listener for window resize
            window.addEventListener('resize', resizeCanvas);

          }).catch((message) => {
            alert(message); // Consider replacing with a custom modal/message box
          });
        };
        document.body.appendChild(script);
      };

      // Removed direct script append from body, moved into window.onload
      // to ensure canvas and container are ready before Unity instance creation.
    </script>
  </body>
</html>
